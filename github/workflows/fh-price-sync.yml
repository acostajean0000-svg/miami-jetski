# Lee los precios "desde" de FareHarbor (endpoint público price-preview que usa su calendario)
# y guarda el resultado como artefacto descargable y en la rama `fh-prices`.
# No toca la rama main ni el sitio: los precios se aplican después en la carpeta local.
name: FareHarbor price sync

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fh-price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Checkout (solo lo necesario)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            operators.json
            tools-data/fh_price_sync.py
            tools-data/fh_build_items.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Recuperar progreso previo (si existe la rama fh-prices)
        run: |
          mkdir -p work
          git fetch origin fh-prices:fh-prices 2>/dev/null && git show fh-prices:prices.jsonl > work/prices.jsonl 2>/dev/null || true
          wc -l work/prices.jsonl 2>/dev/null || echo "sin progreso previo"

      - name: Lista de items
        working-directory: work
        run: python3 ../tools-data/fh_build_items.py ../operators.json

      - name: Leer precios (ritmo lento, reanudable)
        working-directory: work
        timeout-minutes: 270
        run: python3 ../tools-data/fh_price_sync.py items.json

      - name: CSV resumido
        working-directory: work
        run: |
          python3 - <<'EOF'
          import json, csv
          p = json.load(open('prices.json'))
          with open('prices.csv', 'w', newline='') as f:
              w = csv.writer(f); w.writerow(['item_id', 'shortname', 'price', 'currency', 'label', 'date'])
              for k, v in sorted(p.items(), key=lambda x: int(x[0])):
                  w.writerow([k, v.get('sn'), v.get('price'), v.get('currency'), v.get('label'), v.get('date')])
          print('filas', len(p))
          EOF

      - name: Artefacto descargable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fh-prices
          path: |
            work/prices.json
            work/prices.csv
            work/prices.jsonl
          if-no-files-found: warn

      - name: Guardar en la rama fh-prices
        if: always()
        working-directory: work
        run: |
          [ -f prices.jsonl ] || exit 0
          git config user.name "fh-price-sync"; git config user.email "actions@users.noreply.github.com"
          cd ..; git worktree add --orphan -b fh-prices-new /tmp/out 2>/dev/null || git worktree add /tmp/out --detach
          cp work/prices.* /tmp/out/ ; cd /tmp/out
          git add -A; git commit -m "FareHarbor prices $(date -u +%F)" || exit 0
          git push -f origin HEAD:fh-prices
