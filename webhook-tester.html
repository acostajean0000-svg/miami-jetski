<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Refstay Webhook Tester</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 24px; max-width: 720px; margin: 0 auto; background: #fff8f4; color: #0b1020; line-height: 1.5; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  .sub { color: #64748b; margin-bottom: 24px; font-size: 14px; }
  .card { background: white; border: 1px solid #fee4dc; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #334155; }
  input, textarea { width: 100%; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px 12px; font-family: 'SF Mono', Menlo, monospace; font-size: 13px; }
  textarea { min-height: 160px; resize: vertical; }
  button { background: linear-gradient(135deg, #ff385c, #ff7a45); color: white; border: none; padding: 12px 22px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; width: 100%; margin-top: 6px; }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.5; cursor: wait; }
  .result { font-family: 'SF Mono', Menlo, monospace; font-size: 13px; padding: 14px; border-radius: 8px; margin-top: 12px; white-space: pre-wrap; word-break: break-all; }
  .ok { background: #ecfdf5; border: 1px solid #6ee7b7; color: #065f46; }
  .err { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }
  .status { font-weight: 800; font-size: 18px; margin-bottom: 6px; display: block; }
  .verdict { padding: 14px; border-radius: 10px; margin-top: 14px; font-size: 14px; line-height: 1.6; }
  .verdict.good { background: #ecfdf5; border: 1px solid #6ee7b7; }
  .verdict.bad { background: #fef2f2; border: 1px solid #fca5a5; }
  code { background: rgba(0,0,0,0.06); padding: 2px 6px; border-radius: 4px; font-size: 12px; }
</style>
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Internal test page.">
  <link rel="canonical" href="https://miamijetskiboatrentals.com/webhook-tester">
  <meta property="og:image" content="https://miamijetskiboatrentals.com/og-image.png">
</head>
<body>

<h1>🧪 Refstay FareHarbor Webhook Tester</h1>
<div class="sub">Manda un POST de prueba al webhook desde el browser. Sin Terminal, sin curl, sin DNS issues.</div>

<div class="card">
  <label>URL</label>
  <input id="url" value="https://refstay.com/api/fareharbor-webhook" />

  <label style="margin-top:14px;">Secret</label>
  <input id="secret" value="b1f9ce9de17b512f28fc500f5a444e922af7b31e85ee5867" />

  <label style="margin-top:14px;">Payload (JSON)</label>
  <textarea id="payload">{
  "event_type": "booking.created",
  "booking": {
    "uuid": "test-claude-001",
    "display_id": "TEST-001",
    "status": "booked",
    "amount_paid": 250.00,
    "marketing": { "sub_source": "miamistylerentals-jean-acosta" },
    "contact": { "name": "Test Customer" },
    "availability": { "start_at": "2026-06-15T14:00:00Z" },
    "items": [{ "title": "Jet Ski Rental (1hr)" }]
  }
}</textarea>

  <button id="sendBtn" onclick="sendIt()">🚀 Enviar POST</button>
</div>

<div id="output"></div>

<script>
async function sendIt() {
  const url = document.getElementById('url').value.trim();
  const secret = document.getElementById('secret').value.trim();
  const payload = document.getElementById('payload').value.trim();
  const out = document.getElementById('output');
  const btn = document.getElementById('sendBtn');

  out.innerHTML = '';
  btn.disabled = true;
  btn.textContent = 'Enviando…';

  const fullUrl = url + '?secret=' + encodeURIComponent(secret);

  try {
    const res = await fetch(fullUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: payload,
    });
    const text = await res.text();
    let body;
    try { body = JSON.stringify(JSON.parse(text), null, 2); } catch (e) { body = text; }

    const isOk = res.status >= 200 && res.status < 300;
    out.innerHTML = `
      <div class="card">
        <span class="status">${res.status} ${res.statusText}</span>
        <div class="result ${isOk ? 'ok' : 'err'}">${escapeHtml(body)}</div>
        ${verdict(res.status, body)}
      </div>
    `;
  } catch (e) {
    out.innerHTML = `
      <div class="card">
        <span class="status">Network error</span>
        <div class="result err">${escapeHtml(String(e))}</div>
        <div class="verdict bad">
          <strong>El browser no pudo conectar a la URL.</strong> Cosas a chequear:
          <ul>
            <li>¿refstay.com abre en otra pestaña? Si no, el deploy todavía no propaga.</li>
            <li>¿La URL está bien escrita? (debe terminar en <code>/api/fareharbor-webhook</code>)</li>
            <li>¿Tienes CORS bloqueado? — Esta página corre desde tu disco, debería estar OK.</li>
          </ul>
        </div>
      </div>
    `;
  } finally {
    btn.disabled = false;
    btn.textContent = '🚀 Enviar POST';
  }
}

function verdict(status, body) {
  let bodyJson = {};
  try { bodyJson = JSON.parse(body); } catch (e) {}

  if (status === 200 && bodyJson.ok) {
    return `<div class="verdict good">
      🎉 <strong>¡Todo funciona end-to-end!</strong><br>
      El webhook recibió el payload, validó el secret, parseó el host slug (<code>${escapeHtml(bodyJson.host_slug || '')}</code>),
      computó la comisión (<code>$${bodyJson.commission}</code>) e insertó la fila en Supabase.<br>
      <strong>Siguiente paso:</strong> Ve a Supabase → Table Editor → <code>bookings</code> y confirma que aparece una fila con
      <code>fh_booking_uuid = 'test-claude-001'</code>. Después abre <code>refstay.com/dashboard.html</code> con jean-acosta
      y revisa que aparece en "Recent bookings".
    </div>`;
  }
  if (status === 401) {
    return `<div class="verdict bad">
      ❌ <strong>Secret no coincide.</strong> El env var <code>FH_WEBHOOK_SECRET</code> en Vercel
      no es <code>b1f9ce9de17b512f28fc500f5a444e922af7b31e85ee5867</code>. Verifica en
      Vercel → Settings → Environment Variables.
    </div>`;
  }
  if (status === 405) {
    return `<div class="verdict bad">
      ⚠️ El endpoint existe pero rechaza POST — esto NO debería pasar. Revisa que el archivo
      <code>api/fareharbor-webhook.js</code> esté en GitHub después del deploy.
    </div>`;
  }
  if (status === 404) {
    return `<div class="verdict bad">
      ❌ <strong>Endpoint no existe en producción.</strong> El deploy no incluyó la carpeta <code>api/</code>.
      Verifica que <code>refstay.command</code> haya subido <code>api/fareharbor-webhook.js</code> + <code>package.json</code> al repo
      <code>/Users/raptor/Documents/GitHub/refstay</code>.
    </div>`;
  }
  if (status === 500 && /DB write/i.test(body)) {
    return `<div class="verdict bad">
      ❌ <strong>Supabase rechazó el insert.</strong> Probablemente no corriste
      <code>supabase_bookings.sql</code> en el SQL Editor. O el <code>SUPABASE_SERVICE_ROLE_KEY</code>
      en Vercel es incorrecto.
    </div>`;
  }
  if (status === 500 && /misconfigured/i.test(body)) {
    return `<div class="verdict bad">
      ❌ <strong>Faltan env vars en Vercel.</strong> Verifica que las 3 estén creadas:
      <code>SUPABASE_URL</code>, <code>SUPABASE_SERVICE_ROLE_KEY</code>, <code>FH_WEBHOOK_SECRET</code>.
      <br>Si ya están, redeploya (env vars solo aplican al próximo deploy).
    </div>`;
  }
  return `<div class="verdict bad">Status ${status} no esperado — mándame el resultado a Claude.</div>`;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
</script>

</body>
</html>
