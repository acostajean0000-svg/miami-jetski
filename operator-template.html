// --- Escaping helpers (CWE-79: defense-in-depth before innerHTML / url()) ---
const ESC_HTML_MAP={'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;','`':'&#96;'};
function esc(s){return String(s==null?'':s).replace(/[&<>"'`]/g,c=>ESC_HTML_MAP[c]);}
function escAttr(s){return esc(s);}
function escUrl(s){
  if(s==null)return '';
  const u=String(s);
  // Block javascript:/data:/vbscript: schemes; allow http(s), mailto, tel, relative.
  if(/^\s*(javascript|data|vbscript):/i.test(u))return '#';
  return esc(u);
}
function escCssUrl(s){return String(s==null?'':s).replace(/['"\\\s]/g,encodeURIComponent);}
function fmtPrice(p){return (p==null||p===0)?'Contact for pricing':('From $'+esc(p)+'/hr');}
function fmtPriceShort(p){return (p==null||p===0)?'Contact':('$'+esc(p)+'/hr');}

function getSlug(){
  const p=new URLSearchParams(window.location.search);
  if(p.get('slug'))return p.get('slug');
  const parts=window.location.pathname.split('/').filter(Boolean);
  return(parts[parts.length-1]||'').replace(/\.html$/,'');
}

function setMeta(n,c){let e=document.querySelector('meta[name="'+n+'"]');if(!e){e=document.createElement('meta');e.name=n;document.head.appendChild(e);}e.content=c;}
function setOG(p,c){let e=document.querySelector('meta[property="'+p+'"]');if(!e){e=document.createElement('meta');e.setAttribute('property',p);document.head.appendChild(e);}e.content=c;}
function setLD(s){const t=document.createElement('script');t.type='application/ld+json';t.textContent=JSON.stringify(s);document.head.appendChild(t);}
function setCanonical(u){let e=document.querySelector('link[rel="canonical"]');if(!e){e=document.createElement('link');e.rel='canonical';document.head.appendChild(e);}e.href=u;}

function render404(){
  document.getElementById('main').innerHTML='<div class="err"><h2>Operator not found</h2><p>This operator may have moved or been removed.</p><p style="margin-top:16px"><a href="/">← View all 1,250+ operators</a></p></div>';
  document.getElementById('bc').innerHTML='<a href="/">Home</a><span class="sep">›</span><span>Not found</span>';
}

function renderPage(op, allOps){
  const catLabel=CAT_LABELS[op.cat]||op.cat;
  const zoneLabel=ZONE_LABELS[op.zone]||op.zl||op.zone;
  const catPage=CAT_PAGE[op.cat]||'/';
  const zonePage=ZONE_PAGE[op.zone]||'/';
  const slug=SLUG_MAP[op.id]||'';
  const url='https://miamijetskiboatrentals.com/'+encodeURIComponent(slug);
  const priceText=fmtPrice(op.price);
  const priceShort=fmtPriceShort(op.price);
  const country=op.country||'US';
  const region=country==='US'?'FL':'';

  // textContent for title (no HTML)
  document.title=op.name+' | '+catLabel+' in '+zoneLabel+' | Florida Water Sports';
  setMeta('description','Book '+op.name+' — '+catLabel+' in '+zoneLabel+'. '+priceText+'. '+op.addr+'.');
  setCanonical(url);
  setOG('og:title',op.name+' | '+catLabel+' in '+zoneLabel);
  setOG('og:description','Book '+op.name+' in '+zoneLabel+'. '+priceText+'.');
  setOG('og:url',url);
  setOG('og:image','https://miamijetskiboatrentals.com/og-image.png');
  setMeta('twitter:card','summary_large_image');
  setMeta('twitter:image','https://miamijetskiboatrentals.com/og-image.png');

  const ldBusiness={"@context":"https://schema.org","@type":"LocalBusiness","name":op.name,"description":catLabel+" in "+zoneLabel+". "+priceText+".","address":{"@type":"PostalAddress","streetAddress":op.addr,"addressRegion":region,"addressCountry":country},"geo":{"@type":"GeoCoordinates","latitude":op.lat,"longitude":op.lng},"url":url,"image":op.photo};
  if(op.price!=null&&op.price>0)ldBusiness.priceRange="From $"+op.price;
  setLD(ldBusiness);
  setLD({"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://miamijetskiboatrentals.com/"},{"@type":"ListItem","position":2,"name":catLabel,"item":"https://miamijetskiboatrentals.com"+catPage},{"@type":"ListItem","position":3,"name":op.name,"item":url}]});

  document.getElementById('bc').innerHTML='<a href="/">Home</a><span class="sep">›</span><a href="'+escAttr(catPage)+'">'+esc(catLabel)+'</a><span class="sep">›</span><span>'+esc(op.name)+'</span>';

  const related=allOps.filter(o=>o.id!==op.id&&o.cat===op.cat&&o.zone===op.zone).slice(0,4);
  const rel2=related.length<2?allOps.filter(o=>o.id!==op.id&&o.cat===op.cat).slice(0,4):related;
  const relHTML=rel2.map(r=>{
    const rs=SLUG_MAP[r.id]||'';
    return '<a href="/'+encodeURIComponent(rs)+'" class="rc"><div class="rp" style="background-image:url(\''+escCssUrl(r.photo)+'\')"></div><div class="ri"><div class="rn">'+esc(r.name)+'</div><div class="rm">'+esc(CAT_LABELS[r.cat]||r.cat)+' · '+esc(ZONE_LABELS[r.zone]||r.zl||'')+'</div><div class="rpr">'+fmtPriceShort(r.price)+'</div></div></a>';
  }).join('');

  const lat=Number(op.lat)||0, lng=Number(op.lng)||0;
  const mapUrl='https://maps.google.com/maps?q='+encodeURIComponent(lat+','+lng)+'&z=15&output=embed';

  document.getElementById('main').innerHTML=`
    <div class="hero-wrap">
      <img class="hero-photo" src="${escAttr(op.photo)}" alt="${escAttr(op.name)}" loading="eager" fetchpriority="high" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1544551763-46a013bb70d5?w=900&amp;q=80'">
      ${op.badge?'<span class="hero-badge">'+esc(op.badge)+'</span>':''}
    </div>
    <h1>${esc(op.name)}</h1>
    <div class="chips">
      <span class="chip price">${esc(priceText)}</span>
      <span class="chip">${esc(zoneLabel)}</span>
      <span class="chip">${esc(catLabel)}</span>
    </div>
    <a href="${escUrl(op.link)}" target="_blank" rel="noopener noreferrer" class="book-btn">🏄 Book Now — ${esc(priceText)}</a>
    <p class="stitle">📋 Details</p>
    <div class="dg">
      <div class="dc"><div class="dl">Address</div><div class="dv">${esc(op.addr)}</div></div>
      <div class="dc"><div class="dl">Category</div><div class="dv">${esc(catLabel)}</div></div>
      <div class="dc"><div class="dl">Zone</div><div class="dv">${esc(zoneLabel)}</div></div>
      <div class="dc"><div class="dl">Starting Price</div><div class="dv">${esc(priceText)}</div></div>
    </div>
    <p class="stitle">📍 Location</p>
    <div class="map-wrap">
      <iframe src="${escAttr(mapUrl)}" allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
    ${rel2.length?'<p class="stitle">🌊 Similar '+esc(catLabel)+'s Nearby</p><div class="rg">'+relHTML+'</div>':''}
    <p style="margin-top:20px;text-align:center"><a href="${escAttr(catPage)}" style="color:#00d2ff;text-decoration:underline">← All ${esc(catLabel)}s in Florida</a></p>
  `;
}

(function(){
  const slug=getSlug();
  const opId=REV_SLUG[slug];
  if(!opId){render404();return;}
  // 8s timeout, single retry on network failure.
  function load(attempt){
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),8000);
    return fetch('/operators-slim.json',{signal:ctrl.signal})
      .then(r=>{clearTimeout(t);if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .catch(err=>{clearTimeout(t);if(attempt<1)return load(attempt+1);throw err;});
  }
  load(0)
    .then(ops=>{
      const op=ops.find(o=>o.id===opId);
      if(op)renderPage(op,ops);
      else render404();
    })
    .catch(err=>{console.error('operator load failed:',err);render404();});
})();
</script>
