<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operator Photo Audit – MiamiJetski</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f4f8;color:#1a2335}
.toolbar{position:sticky;top:0;z-index:10;background:#0a5f9a;color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.toolbar h1{font-size:16px;font-weight:700;white-space:nowrap}
.toolbar select,.toolbar input{height:34px;border:none;border-radius:6px;padding:0 10px;font-size:13px;background:rgba(255,255,255,.18);color:#fff;outline:none;cursor:pointer}
.toolbar select option{background:#0a5f9a;color:#fff}
.toolbar input::placeholder{color:rgba(255,255,255,.7)}
.toolbar input:focus,.toolbar select:focus{background:rgba(255,255,255,.28)}
.count{font-size:13px;opacity:.8;margin-left:auto}
.stats-bar{background:#1a2335;color:#e8f4f8;padding:8px 20px;font-size:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stats-bar strong{color:#00d2ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px 20px}
.card{background:#fff;border-radius:10px;overflow:hidden;border:2px solid #e0e7ef;position:relative;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.12)}
.card.flagged{border-color:#ef4444;background:#fff5f5}
.card.broken-img{border-color:#f59e0b}
.card-img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#d0e8f0;display:block}
.card-img.broken{background:#ffe4b5}
.card-body{padding:8px 10px 10px}
.card-id{font-size:10px;color:#888;font-family:monospace}
.card-cat{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:10px;margin:3px 0;text-transform:uppercase;letter-spacing:.3px}
.cat-jetski{background:#dbeafe;color:#1d4ed8}
.cat-boat{background:#dcfce7;color:#166534}
.cat-fishing{background:#fef3c7;color:#92400e}
.cat-watersports{background:#e0f2fe;color:#075985}
.cat-tour{background:#f3e8ff;color:#7c3aed}
.cat-slingshot{background:#fee2e2;color:#b91c1c}
.cat-aerial{background:#fce7f3;color:#9d174d}
.cat-atv{background:#fef9c3;color:#713f12}
.cat-golfcart{background:#ecfdf5;color:#065f46}
.cat-jetcar{background:#fff7ed;color:#c2410c}
.cat-bikerental{background:#f0fdf4;color:#15803d}
.card-name{font-size:12px;font-weight:600;line-height:1.3;margin-top:2px;color:#1a2335}
.card-zone{font-size:11px;color:#718096;margin-top:2px}
.flag-btn{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.55);color:#fff;border:none;border-radius:50%;width:26px;height:26px;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.flag-btn.active{background:#ef4444}
.broken-badge{position:absolute;top:6px;left:6px;background:#f59e0b;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px}
.flagged-list{background:#fff;margin:0 20px 20px;border-radius:10px;border:1px solid #e0e7ef;padding:16px}
.flagged-list h2{font-size:15px;font-weight:700;margin-bottom:12px;color:#b91c1c}
.flagged-list pre{font-size:12px;background:#f8f8f8;padding:10px;border-radius:6px;overflow-x:auto;white-space:pre-wrap;max-height:300px;overflow-y:auto}
.copy-btn{margin-top:8px;padding:6px 14px;background:#0a5f9a;color:#fff;border:none;border-radius:6px;font-size:13px;cursor:pointer}
</style>
</head>

const CAT_LABEL={jetski:'Jet Ski',boat:'Boat',fishing:'Fishing',watersports:'Water Sports',tour:'Tour',slingshot:'Slingshot',aerial:'Aerial',atv:'ATV',golfcart:'Golf Cart',jetcar:'Jet Car',bikerental:'Bike Rental'};
const ZONE_LABEL={miami:'Miami',keys:'FL Keys',broward:'Broward',westfl:'West FL',centralfl:'Central FL',gulf:'Gulf',palmbeach:'Palm Beach',nefl:'NE FL',everglades:'Everglades',puntacana:'Punta Cana',cancun:'Cancún',space:'Space Coast'};

let flagged=new Set(JSON.parse(localStorage.getItem('pa_flagged')||'[]'));
let brokenSet=new Set();

function catClass(c){return 'cat-'+c;}

function renderStats(visible,total){
  const byZone={};
  OPS.forEach(o=>{byZone[o.zone]=(byZone[o.zone]||0)+1;});
  const parts=Object.entries(byZone).sort((a,b)=>b[1]-a[1])
    .map(([z,n])=>'<span><strong>'+n+'</strong> '+(ZONE_LABEL[z]||z)+'</span>').join(' || ');
  document.getElementById('statsBar').innerHTML='<span>Showing <strong>'+visible+'</strong> / <strong>'+total+'</strong> operators</span> &nbsp;|&nbsp; '+parts;
}

function render(){
  var q=document.getElementById('q').value.toLowerCase();
  var cat=document.getElementById('filterCat').value;
  var zone=document.getElementById('filterZone').value;
  var show=document.getElementById('filterShow').value;

  var list=OPS.filter(function(o){
    if(q && o.name.toLowerCase().indexOf(q)<0 && o.id.toLowerCase().indexOf(q)<0) return false;
    if(cat && o.cat!==cat) return false;
    if(zone && o.zone!==zone) return false;
    if(show==='flagged' && !flagged.has(o.id)) return false;
    if(show==='broken' && !brokenSet.has(o.id)) return false;
    return true;
  });

  document.getElementById('count').textContent=list.length+' operators';
  renderStats(list.length,OPS.length);

  var html='';
  for(var i=0;i<list.length;i++){
    var o=list[i];
    var isFlagged=flagged.has(o.id);
    var isBroken=brokenSet.has(o.id);
    var cardClass='card'+(isFlagged?' flagged':'')+(isBroken?' broken-img':'');
    var imgClass='card-img'+(isBroken?' broken':'');
    html+='<div class="'+cardClass+'" id="card-'+o.id+'">'
      +(isBroken?'<span class="broken-badge">broken</span>':'')
      +'<img class="'+imgClass+'" src="'+o.photo+'" loading="lazy" alt="'+o.name.replace(/"/g,'&quot;')+'"'
      +' onerror="markBroken(\''+o.id+'\')">'
      +'<div class="card-body">'
      +'<div class="card-id">'+o.id+'</div>'
      +'<span class="card-cat cat-'+o.cat+'">'+(CAT_LABEL[o.cat]||o.cat)+'</span>'
      +'<div class="card-name">'+o.name+'</div>'
      +'<div class="card-zone">'+(ZONE_LABEL[o.zone]||o.zone)+' &middot; '+o.zl+'</div>'
      +'</div>'
      +'<button class="flag-btn'+(isFlagged?' active':'')+'" onclick="toggleFlag(\''+o.id+'\')" title="Flag for fix">⚑</button>'
      +'</div>';
  }
  document.getElementById('grid').innerHTML=html;
  updateFlaggedList();
}

function markBroken(id){
  brokenSet.add(id);
  var card=document.getElementById('card-'+id);
  if(card){
    card.classList.add('broken-img');
    if(!card.querySelector('.broken-badge'))
      card.insertAdjacentHTML('afterbegin','<span class="broken-badge">broken</span>');
  }
}

function toggleFlag(id){
  if(flagged.has(id)) flagged.delete(id); else flagged.add(id);
  localStorage.setItem('pa_flagged',JSON.stringify([...flagged]));
  render();
}

function updateFlaggedList(){
  var fl=document.getElementById('flaggedList');
  if(flagged.size===0){fl.style.display='none';return;}
  fl.style.display='block';
  var lines=['['];
  flagged.forEach(function(id){
    var o=OPS.find(function(x){return x.id===id;});
    if(o) lines.push('  {"id":"'+o.id+'","name":"'+o.name.replace(/"/g,'\\"')+'","zone":"'+o.zone+'"},');
    else lines.push('  {"id":"'+id+'"},');
  });
  if(lines.length>1) lines[lines.length-1]=lines[lines.length-1].replace(/,$/,'');
  lines.push(']');
  document.getElementById('flaggedJson').textContent=lines.join('\n');
}

function copyFlagged(){
  navigator.clipboard.writeText(document.getElementById('flaggedJson').textContent);
  var btn=document.querySelector('.copy-btn');
  btn.textContent='Copied!';
  setTimeout(function(){btn.textContent='Copy IDs';},1500);
}

document.getElementById('q').addEventListener('input',render);
document.getElementById('filterCat').addEventListener('change',render);
document.getElementById('filterZone').addEventListener('change',render);
document.getElementById('filterShow').addEventListener('change',render);
render();

</script>
